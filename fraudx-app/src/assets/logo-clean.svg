<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" fill="none">
  <defs>
    <!-- Emerald Shield Gradient -->
    <linearGradient id="shieldGrad" x1="120" y1="50" x2="300" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#34D399" />
      <stop offset="60%" stopColor="#2ECC87" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>

    <!-- Electric Blue Delta Gradient -->
    <linearGradient id="deltaGrad" x1="140" y1="40" x2="280" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#60A5FA" />
      <stop offset="50%" stopColor="#4A7BF7" />
      <stop offset="100%" stopColor="#3B82F6" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Green Shield Path (Interlaced) -->
  <path
    d="M152 76 H268 C276 76 280 84 278 94 L266 182 C262 208 210 248 210 248 C210 248 158 208 154 182 L142 94 C140 84 144 76 152 76 Z"
    stroke="url(#shieldGrad)"
    stroke-width="16"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
  />

  <!-- 2. Electric Blue Delta / AI Loop (Overlapping & Interlacing) -->
  <path
    d="M210 52 L278 184 C284 196 276 210 262 210 L130 216 C114 216 106 200 114 188 L142 144"
    stroke="url(#deltaGrad)"
    stroke-width="16"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
  />

  <path
    d="M142 144 L196 60 C202 50 218 50 224 60 L242 96"
    stroke="url(#deltaGrad)"
    stroke-width="16"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Delta Wingtip Extensions -->
  <path
    d="M126 214 L114 232 C108 242 114 254 126 254 L294 254 C306 254 312 242 306 232 L294 214"
    stroke="url(#deltaGrad)"
    stroke-width="15"
    stroke-linejoin="round"
    stroke-linecap="round"
    fill="none"
  />

  <!-- 3. Wordmark: FRAUDX AI -->
  <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="210" y="326" text-anchor="middle" font-size="44" font-weight="900" letter-spacing="3.5">
      <tspan fill="#2ECC87">FRAUDX</tspan>
      <tspan dx="12" fill="#94A3B8">AI</tspan>
    </text>
  </g>
</svg>
